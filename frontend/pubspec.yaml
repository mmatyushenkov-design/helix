name: workout_tracker_frontend
description: "Helix - local strength training tracker with 5/3/1 periodization."
publish_to: 'none'
version: 1.1.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.7
  crypto: ^3.0.6
  file_picker: ^10.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  uuid: ^4.5.1
  sqflite_common_ffi: ^2.4.5
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/muscle_groups_consistent/
